# nginx : site statique pour Vox.
# Placez ce fichier dans /etc/nginx/sites-available/vox puis activez-le.
# Les certificats viennent de certbot (voir DEPLOY.md) ; remplacez le
# domaine et les chemins avant de recharger nginx.

server {
    listen 80;
    listen [::]:80;
    server_name vox.exemple.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vox.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/vox.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vox.exemple.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/vox;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    types {
        application/manifest+json webmanifest;
        image/svg+xml              svg;
        text/javascript            js;
    }
    default_type application/octet-stream;

    # Toujours revalides : sans cela une mise a jour de l'app reste invisible.
    location = /index.html     { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /sw.js          { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /               { add_header Cache-Control "no-cache, must-revalidate"; }

    location ~* ^/icon(-maskable)?\.svg$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # L'application n'a pas de backend : aucun upload, aucune execution.
    location ~ /\. { deny all; }
}
